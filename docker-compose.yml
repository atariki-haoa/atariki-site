services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: atariki-site-frontend:latest
    container_name: atariki-site-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: atariki-site-backend:latest
    container_name: atariki-site-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - blog-data:/app/data

volumes:
  blog-data:
