services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: atariki-site-frontend:staging
    container_name: atariki-site-staging-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "127.0.0.1:15001:3000"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: atariki-site-backend:staging
    container_name: atariki-site-staging-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:15002:4000"
    volumes:
      - blog-data-staging:/app/data

volumes:
  blog-data-staging:
